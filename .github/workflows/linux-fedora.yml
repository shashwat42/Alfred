name: Fedora Linux

on:
  push:
    branches-ignore: ['releases/**']
    paths: ['src/**', 'wrapper/**', 'scripts/**', 'package*.json', 'vite.config.ts', 'tsconfig*.json', '.github/workflows/linux-fedora.yml']
  pull_request:
    paths: ['src/**', 'wrapper/**', 'scripts/**', 'package*.json', 'vite.config.ts', 'tsconfig*.json', '.github/workflows/linux-fedora.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      MODE: production
      VITE_API_BASE_URL: ${{ vars.ALFRED_LINUX_API_URL || 'https://alfred-137-23-49-88.sslip.io' }}
    steps:
      - name: Install Fedora build toolchain
        run: >-
          dnf install -y git nodejs npm rust cargo gcc gcc-c++ make
          pkgconf-pkg-config openssl-devel gtk3-devel webkit2gtk4.1-devel
          libappindicator-gtk3-devel librsvg2-devel libxdo-devel desktop-file-utils xdg-utils
          gstreamer1-plugins-good dbus-daemon
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: npm ci
      - run: npm run linux:check
      - run: npm test
      - run: npm run test:updates-ui
      - run: npm run test:overlay-shortcut-ui
      - run: npm run lint
      - run: npm run build:linux
      - run: cargo test --locked --manifest-path wrapper/Cargo.toml
      - name: Test the installer protocol on an isolated D-Bus session
        run: dbus-run-session -- cargo test --locked --manifest-path wrapper/Cargo.toml --lib updates::packagekit::tests::private_bus_install_waits_for_success_and_reports_cancel_and_failure -- --ignored
      - name: Sign Linux updater artifacts for an explicit release build
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/releases/')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ALFRED_RELEASE_API_URL: ${{ vars.ALFRED_LINUX_API_URL || 'https://alfred-137-23-49-88.sslip.io' }}
        run: npm run release:linux
      - name: Upload signed updater artifacts
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/releases/')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alfred-linux-signed-release
          path: .deployment/linux-releases/**
          include-hidden-files: true
          if-no-files-found: error
      - name: Record RPM checksums and source
        shell: bash
        run: |
          cd wrapper/target/release/bundle/rpm
          sha256sum *.rpm > SHA256SUMS-linux.txt
          node -e 'const fs=require("node:fs"); fs.writeFileSync("linux-release-manifest.json", JSON.stringify({version:JSON.parse(fs.readFileSync(process.env.GITHUB_WORKSPACE+"/package.json")).version, sourceCommit:process.env.GITHUB_SHA, platform:"fedora-x86_64", apiOrigin:process.env.VITE_API_BASE_URL, builtAt:new Date().toISOString()}, null, 2)+"\n")'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alfred-fedora-rpm
          path: |
            wrapper/target/release/bundle/rpm/*.rpm
            wrapper/target/release/bundle/rpm/SHA256SUMS-linux.txt
            wrapper/target/release/bundle/rpm/linux-release-manifest.json
          if-no-files-found: error
