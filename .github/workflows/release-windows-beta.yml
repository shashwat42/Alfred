name: Prepare Windows beta draft

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-beta-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MODE: development
      # These are isolated test fixtures, never deployment credentials.
      GOOGLE_CLIENT_ID: isolated-ci
      GOOGLE_CALLBACK_URL: http://localhost/auth/google/callback
      MONGODB_URI: mongodb://127.0.0.1/unused_test
      LLM_API_KEY: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: npm ci
      - run: npm ci --prefix Alfred_Backend
      - name: Generate an ephemeral test signing secret
        shell: bash
        run: |
          for name in JWT_SECRET GOOGLE_CLIENT_SECRET; do
            test_secret="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
            echo "::add-mask::$test_secret"
            echo "$name=$test_secret" >> "$GITHUB_ENV"
          done
      - name: Development checks with isolated databases and stub providers
        run: |
          npm test
          npm run lint
          npm --prefix Alfred_Backend run check
          npm --prefix Alfred_Backend test
          npm run test:reliability-ui
          npm run test:updates-ui
          npm run test:startup-ui
          npm run build:development

  package:
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: npm ci
      - run: rustup target add x86_64-pc-windows-msvc
      - name: Windows updater tests in development mode
        env:
          MODE: development
        run: |
          npm run build:development
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path wrapper/Cargo.toml --locked --lib updates::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the actual beta installer
        env:
          # Public endpoint configuration only; backend credentials stay on the API.
          ALFRED_RELEASE_API_URL: ${{ vars.ALFRED_RELEASE_API_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run release:windows
      - name: Create a draft prerelease for review
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $output = ".deployment/releases/$tag"
          $manifest = Get-Content "$output/release-manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.hasTrackedChanges) { throw 'Release packaging changed tracked source files.' }
          # Fail if this version already exists; never overwrite published assets.
          $existing = gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists. Choose a new beta version." }
          gh release create $tag "$output/$($manifest.installer)" "$output/$($manifest.installer).sig" "$output/latest.json" "$output/SHA256SUMS.txt" "$output/release-manifest.json" --target $env:GITHUB_SHA --title "Alfred $tag" --notes-file "$output/RELEASE_NOTES.md" --draft --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft prerelease.' }
