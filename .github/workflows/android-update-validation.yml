name: Validate Android update discovery

on:
  push:
    branches: ['build/android-update-validation']

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MODE: production
      VITE_API_BASE_URL: https://alfred-137-23-49-88.sslip.io
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prepare Android SDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          sdk_manager="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -x "$sdk_manager"
          set +o pipefail
          yes | "$sdk_manager" --licenses >/dev/null
          set -o pipefail
          "$sdk_manager" 'platforms;android-37.0' 'build-tools;37.0.0'
      - run: npm ci
      - run: npm run build
      - name: Compile the assistant and test update policy
        run: bash wrapper/gen/android/gradlew -p wrapper/android/assistant testDebugUnitTest
