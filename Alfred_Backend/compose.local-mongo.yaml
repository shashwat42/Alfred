# Optional disposable local development database. Atlas is the default.
# docker compose -f compose.yaml -f compose.local-mongo.yaml up -d --build
services:
  backend:
    environment:
      MONGODB_URI: mongodb://mongo:27017/alfred?replicaSet=alfred
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully

  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "alfred", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 30

  mongo-init:
    image: mongo:8.0
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./docker/init-replica.js:/scripts/init-replica.js:ro
    entrypoint: ["mongosh", "--host", "mongo:27017", "--quiet", "--file", "/scripts/init-replica.js"]

volumes:
  mongo-data:
