# Merge with compose.yaml. Requires Docker Compose >= 2.30 (raw env files).
services:
  backend:
    build: !reset null
    image: ${ALFRED_BACKEND_IMAGE:?CI must supply the backend image}
    platform: ${ALFRED_PLATFORM:?CI must supply the VM platform}
    env_file: !override
      - path: ${ALFRED_RUNTIME_DIR:?Deployment runtime directory}/backend.env
        format: raw
    environment: !reset {}
    stop_grace_period: 45s
    ports: !override
      - "127.0.0.1:8000:8000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
