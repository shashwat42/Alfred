# Atlas is the default database; MONGODB_URI comes from .env.
name: alfred

services:
  backend:
    build:
      context: .
    init: true
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      # Application policy uses MODE, independently of NODE_ENV in the image.
      MODE: ${DOCKER_MODE:-development}
      PORT: "8000"
    ports:
      - "127.0.0.1:${DOCKER_API_PORT:-8000}:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
